<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introvert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Живой видео-фон */
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Эффект оригинальной сетки guns.lol поверх видео */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-image: radial-gradient(rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.5) 100%), 
                              linear-gradient(rgba(18, 18, 18, 0.3) 50%, rgba(0, 0, 0, 0.4) 50%), 
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.1));
            background-size: 100% 100%, 4px 4px, 4px 4px;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #overlay p {
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 7px;
            text-transform: uppercase;
            animation: pulse 1.8s infinite alternate;
            font-weight: 500;
        }

        /* Главная карточка */
        .profile-card {
            position: relative;
            z-index: 3;
            background: rgba(20, 20, 20, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            width: 440px;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.65);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .username {
            font-size: 1.9rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 400;
            margin-bottom: 16px;
            opacity: 0.95;
        }

        .location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #aaaaaa;
            font-size: 0.85rem;
            font-weight: 400;
        }

        .location svg {
            width: 13px;
            height: 13px;
            fill: #aaaaaa;
        }

        @keyframes pulse {
            0% { opacity: 0.35; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="enterSite()">
        <p>click to enter</p>
    </div>

    <!-- Задний план из видео и сетки -->
    <video class="background-video" id="bg-video" loop muted playsinline>
        <source src="https://githubusercontent.com" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="profile-card" id="card">
        <img src="https://githubusercontent.com" alt="avatar" class="avatar">
        <div class="username">introvert</div>
        <div class="status-text">пускаю в вену Hashcat</div>
        <div class="location">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            your mother grave
        </div>
    </div>

    <audio id="audio" loop src="https://githubusercontent.com"></audio>

    <script>
        function enterSite() {
            const overlay = document.getElementById('overlay');
            const card = document.getElementById('card');
            const audio = document.getElementById('audio');
            const video = document.getElementById('bg-video');
            
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';
            
            video.play().catch(err => console.log("Видео заблокировано"));
            
            setTimeout(() => {
                card.classList.add('show');
                audio.play().catch(err => {});
            }, 300);
        }
    </script>
</body>
</html>
