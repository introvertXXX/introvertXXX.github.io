<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>introvert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        .dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.30);
            z-index: 1;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #overlay p {
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: pulse 1.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .profile-card {
            position: relative;
            z-index: 2;
            background: rgba(20, 20, 20, 0.40);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            width: 500px;
            padding: 38px 28px 42px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px) scale(0.97);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .profile-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            padding: 2px;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.04), transparent, rgba(255, 255, 255, 0.04), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.8s;
        }
        .profile-card.show::before {
            opacity: 1;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.02);
        }

        .username {
            font-size: 2.2rem;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.35);
        }

        .status-text {
            font-size: 1.15rem;
            color: #000000;
            font-weight: 500;
            margin-bottom: 10px;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.25);
        }

        .location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #000000;
            font-size: 0.9rem;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.20);
        }

        .location svg {
            width: 16px;
            height: 16px;
            fill: #000000;
            filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.15));
        }

        .divider {
            width: 44px;
            height: 2px;
            margin: 12px auto 14px;
            background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.25), transparent);
            border-radius: 4px;
        }

        .profile-card:hover {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.4s ease;
        }

        @media (max-width: 600px) {
            .profile-card {
                width: 92%;
                padding: 28px 16px 32px;
            }
            .username {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="enterSite()">
        <p>click to enter</p>
    </div>

    <div class="dark-overlay"></div>

    <video class="background-video" id="bg-video" loop muted playsinline>
        <source src="fon.mp4" type="video/mp4">
    </video>

    <div class="profile-card" id="card">
        <img src="d.png" alt="avatar" class="avatar" />
        <div class="username">introvert</div>
        <div class="status-text">пускаю в вечеру Hashcat</div>
        <div class="divider"></div>
        <div class="location">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            your mother grave
        </div>
    </div>

    <audio id="audio" loop src="anon.mp3"></audio>

    <script>
        function enterSite() {
            const overlay = document.getElementById('overlay');
            const card = document.getElementById('card');
            const audio = document.getElementById('audio');
            const video = document.getElementById('bg-video');

            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';

            video.play().catch(err => console.log("Видео заблокировано"));

            setTimeout(() => {
                card.classList.add('show');
                audio.play().catch(err => {});
            }, 300);
        }
    </script>
</body>
</html>
