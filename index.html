<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introvert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Максимально темный оверлей + Старый TV эффект */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.4) 10%, rgba(0, 0, 0, 0.95) 100%),
                        linear-gradient(rgba(10, 10, 10, 0.3) 50%, rgba(0, 0, 0, 0.6) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.2));
            background-size: 100% 100%, 4px 4px, 4px 4px;
        }

        .video-overlay::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 2;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            animation: tv-flicker 0.15s infinite, tv-scanline 6s linear infinite;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #overlay p {
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 7px;
            text-transform: uppercase;
            animation: pulse 1.8s infinite alternate;
            font-weight: 500;
        }

        /* Красивая темная карточка с градиентом */
        .profile-card {
            position: relative;
            z-index: 3;
            background: linear-gradient(145deg, rgba(35, 35, 35, 0.7) 0%, rgba(15, 15, 15, 0.85) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 440px;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.85);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Строгий черный глубокий ник */
        .username {
            font-size: 1.95rem;
            font-weight: 900;
            color: #000000;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .status-text {
            font-size: 1.05rem;
            color: #eeeeee;
            font-weight: 400;
            margin-bottom: 16px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #cccccc;
            font-size: 0.85rem;
            font-weight: 400;
        }

        .location svg {
            width: 13px;
            height: 13px;
            fill: #cccccc;
        }

        @keyframes tv-flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        @keyframes tv-scanline {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        @keyframes pulse {
            0% { opacity: 0.35; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="enterSite()">
        <p>click to enter</p>
    </div>

    <video class="background-video" id="bg-video" loop muted playsinline>
        <source src="https://githubusercontent.com" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="profile-card" id="card">
        <img src="https://githubusercontent.com" alt="avatar" class="avatar">
        <div class="username">introvert</div>
        <div class="status-text">пускаю в вену Hashcat</div>
        <div class="location">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            your mother grave
        </div>
    </div>

    <audio id="audio" loop src="https://githubusercontent.com"></audio>

    <script>
        function enterSite() {
            const overlay = document.getElementById('overlay');
            const card = document.getElementById('card');
            const audio = document.getElementById('audio');
            const video = document.getElementById('bg-video');
            
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';
            
            video.play().catch(err => console.log("Видео заблокировано"));
            
            setTimeout(() => {
                card.classList.add('show');
                audio.play().catch(err => {});
            }, 300);
        }
    </script>
</body>
</html>
