<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introvert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #overlay p {
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: pulse 1.8s infinite alternate;
        }

        /* Карточка сделана светлым матовым стеклом для контраста с черным текстом */
        .profile-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            width: 500px;
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
            border: 2px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* Ник теперь черный и худой */
        .username {
            font-size: 2rem;
            font-weight: 300; 
            color: #000000;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        /* Весь остальной текст тоже черный */
        .status-text {
            font-size: 1.1rem;
            color: #000000;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #000000;
            font-size: 0.85rem;
        }

        .location svg {
            width: 14px;
            height: 14px;
            fill: #000000;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="enterSite()">
        <p>click to enter</p>
    </div>

    <video class="background-video" id="bg-video" loop muted playsinline>
        <source src="fon.mp4" type="video/mp4">
    </video>

    <div class="profile-card" id="card">
        <img src="d.png" alt="avatar" class="avatar">
        <div class="username">introvert</div>
        <div class="status-text">пускаю в вену Hashcat</div>
        <div class="location">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            your mother grave
        </div>
    </div>

    <audio id="audio" loop src="anon.mp3"></audio>

    <script>
        function enterSite() {
            const overlay = document.getElementById('overlay');
            const card = document.getElementById('card');
            const audio = document.getElementById('audio');
            const video = document.getElementById('bg-video');
            
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';
            
            video.play().catch(err => console.log("Видео заблокировано"));
            
            setTimeout(() => {
                card.classList.add('show');
                audio.play().catch(err => {});
            }, 300);
        }
    </script>
</body>
</html>
