<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>introvert</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    user-select: none;
}
body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}
.back-vid {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
}
#overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}
#overlay p {
    color: #fff;
    font-size: 19px;
    letter-spacing: 6px;
    text-transform: uppercase;
    animation: pulse-txt 1.8s infinite alternate;
}
@keyframes pulse-txt {
    0% { opacity: 0.3; }
    100% { opacity: 1; }
}
.main-box {
    position: relative;
    z-index: 5;
    width: 490px;
    padding: 42px 28px;
    text-align: center;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: linear-gradient(to bottom, rgba(38, 38, 38, 0.52) 0%, rgba(18, 18, 18, 0.68) 100%);
    box-shadow: 0 22px 45px rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    opacity: 0;
    transform: translateY(18px);
    transition: all 0.95s cubic-bezier(0.16, 1, 0.3, 1);
}
.main-box.show-box {
    opacity: 1;
    transform: translateY(0);
}
.pfp {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 22px;
    border: 2px solid rgba(255, 255, 255, 0.11);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
}
.txt-name {
    color: #fff;
    font-size: 33px;
    font-weight: 300;
    letter-spacing: -0.5px;
    margin-bottom: 5px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
}
.sub-status {
    color: #fff;
    font-size: 18px;
    font-weight: 300;
    margin-bottom: 15px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}
.loc-inf {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: #b0b0b0;
    font-size: 13.5px;
    font-weight: 300;
    margin-bottom: 12px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}
.loc-inf svg {
    width: 14px;
    height: 14px;
    fill: #b0b0b0;
}
.years-inf {
    color: #888888;
    font-size: 12.5px;
    font-weight: 300;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}
</style>
</head>
<body>

<div id="overlay" onclick="start()">
    <p>click to enter</p>
</div>

<!-- Полностью локальные пути без доменов и внешних ссылок -->
<video class="back-vid" id="bg-loop" loop muted playsinline>
    <source src="fon.mp4" type="video/mp4">
</video>

<div class="main-box" id="bio-card">
    <img src="d.png" alt="pfp" class="pfp">
    <div class="txt-name">introvert</div>
    <div class="sub-status">пускаю в вену Hashcat</div>
    <div class="loc-inf">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        your mother grave
    </div>
    <div class="years-inf">2019-2025</div>
</div>

<audio id="bg-track" loop src="anon.mp3"></audio>

<script>
function start() {
    var screen = document.getElementById('overlay');
    var card = document.getElementById('bio-card');
    var music = document.getElementById('bg-track');
    var video = document.getElementById('bg-loop');
    
    screen.style.opacity = '0';
    screen.style.visibility = 'hidden';
    
    video.play().catch(function(e){});
    
    setTimeout(function() {
        card.classList.add('show-box');
        music.play().catch(function(e){});
    }, 280);
}
</script>
</body>
</html>
